version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: epmp-postgres
    environment:
      POSTGRES_USER: epmp_user
      POSTGRES_PASSWORD: secure_password
      POSTGRES_DB: epmp_main
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: epmp-redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./epmp
    container_name: epmp-backend
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: epmp_main
      DB_USERNAME: epmp_user
      DB_PASSWORD: secure_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - ./epmp:/var/www/html

  frontend:
    build:
      context: ./epmp-frontend
    container_name: epmp-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000/api/v1

volumes:
  postgres_data:
